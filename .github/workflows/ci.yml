name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check bans
        run: node scripts/check-bans.mjs

      - name: Run tests
        run: npm test

  pack:
    name: pack (ubuntu-latest, node 22)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify package tarball
        run: |
          npm pack --dry-run
          PACK_JSON=$(npm pack --dry-run --json)
          node -e '
            const data = JSON.parse(process.argv[1]);
            const pkg = Array.isArray(data) ? data[0] : data;
            const files = (pkg.files || []).map(f => typeof f === "string" ? f : f.path);
            console.log(`Tarball contains ${files.length} files, unpacked size: ${pkg.unpackedSize} bytes`);

            const forbiddenPatterns = ["node_modules/", "_workflow/", "eval/", ".mp4"];
            const forbiddenMatches = files.filter(f =>
              forbiddenPatterns.some(p => f.includes(p)) ||
              f.startsWith("node_modules") ||
              f.startsWith("_workflow") ||
              f.startsWith("eval") ||
              f.endsWith(".mp4")
            );

            if (forbiddenMatches.length > 0) {
              console.error("FAIL: Tarball contains forbidden files:", forbiddenMatches);
              process.exit(1);
            }

            const maxBytes = 5 * 1024 * 1024; // 5 MB
            if (pkg.unpackedSize > maxBytes) {
              console.error(`FAIL: Unpacked size ${pkg.unpackedSize} exceeds 5 MB limit (${maxBytes} bytes)`);
              process.exit(1);
            }

            console.log("PASS: Package tarball file list and size checks passed.");
          ' "$PACK_JSON"

  pack-install:
    name: pack-install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Pack and test installation
        run: |
          TARBALL=$(npm pack | tail -n 1)
          TARBALL_PATH=$(pwd)/$TARBALL
          TEMP_DIR=$(mktemp -d)
          cd "$TEMP_DIR"
          npm init -y
          npm install "$TARBALL_PATH"
          git init -b main
          git config user.name "CI"
          git config user.email "ci@example.com"
          cat << 'EOF' > docker-compose.yml
          services:
            web:
              image: nginx:alpine
          EOF
          git add docker-compose.yml
          git commit -m "initial commit"
          cat << 'EOF' > docker-compose.yml
          services:
            web:
              image: nginx:alpine
              privileged: true
          EOF
          git add docker-compose.yml
          git commit -m "add privileged"
          set +e
          npx archtour check --changed-from HEAD~1 .
          EXIT_CODE=$?
          set -e
          if [ $EXIT_CODE -ne 1 ]; then
            echo "Expected exit code 1 from npx archtour check, got $EXIT_CODE"
            exit 1
          fi
          echo "PASS: pack-install test passed."
