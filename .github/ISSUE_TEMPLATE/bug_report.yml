name: Bug Report
description: File a bug report for Archtour
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug report! Please provide the details below.
        Ensure any sensitive tokens, credentials, or secrets are redacted from input samples.
  - type: input
    id: os
    attributes:
      label: Operating System (OS)
      description: e.g. Windows 11, macOS 14 Sonoma, Ubuntu 22.04
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node Version
      description: e.g. v18.20.0, v20.11.0 (run `node -v`)
    validations:
      required: true
  - type: input
    id: archtour-version
    attributes:
      label: Archtour Version
      description: e.g. 0.1.0 (or commit hash)
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command
      description: The exact command you executed
      placeholder: npx archtour scan .
    validations:
      required: true
  - type: textarea
    id: input-sample
    attributes:
      label: Input Sample (with secrets removed)
      description: Provide a minimal reproducible input sample (.diag, schema file, or JSON spec) with all secrets and private data removed.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened? (Include error output or screenshots)
    validations:
      required: true
