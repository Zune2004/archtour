<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 64" width="300" height="64" role="img" aria-label="Archtour">
  <title>Archtour</title>
  <g>
    <!-- The lens: see every change. -->
    <circle cx="27" cy="27" r="18" fill="none" stroke="#E2E8F0" stroke-width="5"/>
    <path d="M40 40 L56 56" stroke="#E2E8F0" stroke-width="7" stroke-linecap="round"/>
    <!-- The architecture under it: three connected nodes. -->
    <path d="M19 32 L27 20 L35 32" fill="none" stroke="#FBBF24" stroke-width="3.5" stroke-linejoin="round"/>
    <circle cx="19" cy="32" r="4" fill="#FBBF24"/>
    <circle cx="27" cy="20" r="4" fill="#FBBF24"/>
    <circle cx="35" cy="32" r="4" fill="#FBBF24"/>
  </g>
  <text x="74" y="45" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="36" font-weight="700" letter-spacing="-0.5" fill="#F1F5F9">Arch<tspan fill="#FBBF24">tour</tspan></text>
</svg>
