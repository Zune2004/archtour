<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 64" width="300" height="64" role="img" aria-label="Archtour">
  <title>Archtour</title>
  <g>
    <!-- The lens: see every change. -->
    <circle cx="27" cy="27" r="18" fill="none" stroke="#1E293B" stroke-width="5"/>
    <path d="M40 40 L56 56" stroke="#1E293B" stroke-width="7" stroke-linecap="round"/>
    <!-- The architecture under it: three connected nodes. -->
    <path d="M19 32 L27 20 L35 32" fill="none" stroke="#D97706" stroke-width="3.5" stroke-linejoin="round"/>
    <circle cx="19" cy="32" r="4" fill="#D97706"/>
    <circle cx="27" cy="20" r="4" fill="#D97706"/>
    <circle cx="35" cy="32" r="4" fill="#D97706"/>
  </g>
  <text x="74" y="45" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="36" font-weight="700" letter-spacing="-0.5" fill="#1E293B">Arch<tspan fill="#D97706">tour</tspan></text>
</svg>
